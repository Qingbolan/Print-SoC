# Version policy shared by local builds and CI.
[release]
tag_prefix = "v"
require_annotated_tags = true

[time]
timezone = "+08:00"

[remote]
strategy = "local-only"
name = "origin"
fallback_to_local = false

[cache]
# Pinned Tide does not include the annotated-tag inventory in its cache key.
# Recompute after tag changes so local and CI release coordinates agree.
enabled = false

[output]
metadata_suffix = ""
follow_renames = true
