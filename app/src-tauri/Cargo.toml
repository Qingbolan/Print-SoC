[package]
name = "print_at_soc"
version = "0.376.9"
description = "Print_at_SoC - Smart Printing for NUS SoC"
authors = ["Silan Hu(silan.hu@u.nus.edu)"]
license = "MIT"
repository = "https://github.com/Qingbolan/nus-llama-printer"
edition = "2021"

[lib]
name = "print_at_soc_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-geolocation = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
regex = "1"
walkdir = "2"
# SSH and async
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
tokio = { version = "1", features = ["full"] }
# PDF processing
lopdf = "0.34"
# Additional utilities
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
lazy_static = "1.4"
dirs = "5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
sha2 = "0.10"
tempfile = "3"
fs2 = "0.4"
dialoguer = "0.11"
indicatif = "0.17"
url = "2"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-cli = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
